apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: name-picker-rigged
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: name-picker-rigged
    server: "https://kubernetes.default.svc"
  source:
    path: gitops/manifests/name-picker-rigged
    repoURL: "https://github.com/timmyb824/homelab-kubernetes-apps.git"
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
