# Internal status API: full snapshot, gated by Authentik forward-auth
# (middleware defined in Traefik's file provider — non-gitops/traefik).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homelab-live-status-internal
  namespace: homelab-live-status
  annotations:
    kubernetes.io/ingress.class: traefik-external
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.local.timmybtech.com`)
      kind: Rule
      middlewares:
        - name: authentik@file
      services:
        # - name: homelab-live-status-internal
        #   port: 80
        # - name: ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local
        #   port: 80
        - name: ak-outpost-authentik-embedded-outpost
          namespace: authentik
          port: 9000
  tls:
    secretName: local-timmybtech-com-tls
