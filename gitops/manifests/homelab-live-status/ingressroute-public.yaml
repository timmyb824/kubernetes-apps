# Public status API: serves only the redacted snapshot (PLAN.md §5), so no
# auth middleware — reached from the internet via the cloudflared tunnel.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homelab-live-status-public
  namespace: homelab-live-status
  annotations:
    kubernetes.io/ingress.class: traefik-external
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.timmybtech.com`)
      kind: Rule
      services:
        - name: homelab-live-status-public
          port: 80
  tls:
    secretName: timmybtech-com-tls
