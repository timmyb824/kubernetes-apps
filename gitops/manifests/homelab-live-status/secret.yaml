# Values injected from Vault by the ArgoCD Vault Plugin.
# Populate Vault first:
#   vault kv put secret/homelab-live-status \
#     TRAEFIK_USER=... TRAEFIK_PASSWORD=... \
#     ADGUARD_USER=... ADGUARD_PASSWORD=... \
#     ARGOCD_API_KEY=... PROXMOX_API_TOKEN="<user>@<realm>!<id>=<secret>"
apiVersion: v1
kind: Secret
metadata:
  name: homelab-live-status-secrets
  namespace: homelab-live-status
  annotations:
    avp.kubernetes.io/path: "secret/data/homelab-live-status"
type: Opaque
stringData:
  TRAEFIK_USER: <path:secret/data/homepage#TRAEFIK_USER>
  TRAEFIK_PASSWORD: <path:secret/data/homepage#TRAEFIK_PASSWORD>
  ADGUARD_USER: <path:secret/data/homepage#ADGUARD_USER>
  ADGUARD_PASSWORD: <path:secret/data/homepage#ADGUARD_PASSWORD>
  ARGOCD_API_KEY: <path:secret/data/homepage#ARGOCD_KEY>
  PROXMOX_API_TOKEN: <path:secret/data/homepage#PROXMOX_API_TOKEN>
